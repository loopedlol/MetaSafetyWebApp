<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="598" viewBox="0 0 1200 598" role="img" aria-labelledby="title desc"><title id="title">Safety Lens system diagram</title><desc id="desc">Implementation-oriented diagram; arrows identify information flow. See adjacent README text for accessible explanation and limitations.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#53636b"/></marker></defs><rect width="1200" height="598" rx="12" fill="#f3f2ed"/><text x="35" y="42" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536927" font-weight="700">02 / WEARABLE + WEB SYSTEMS / SYSTEM MAP</text><text x="35" y="80" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172329" font-weight="700">Two interfaces. Shared state. Explicit human decisions.</text><rect x="35" y="116" width="320" height="110" rx="9" fill="#e9e8e2" stroke="#cad1ce"/><rect x="35" y="134" width="4" height="74" fill="#536927"/><text x="57" y="150" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#172329" font-weight="700">Browser dashboard</text><text x="57" y="181" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Detailed edits, records, reports</text><text x="57" y="205" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Korean + English</text><rect x="440" y="116" width="320" height="110" rx="9" fill="#e9e8e2" stroke="#cad1ce"/><rect x="440" y="134" width="4" height="74" fill="#536927"/><text x="462" y="150" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#172329" font-weight="700">Shared workflow</text><text x="462" y="181" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Attendance → hazards → review</text><text x="462" y="205" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Explicit confirmation gates</text><rect x="845" y="116" width="320" height="110" rx="9" fill="#e9e8e2" stroke="#cad1ce"/><rect x="845" y="134" width="4" height="74" fill="#536927"/><text x="867" y="150" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#172329" font-weight="700">Glasses interface</text><text x="867" y="181" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >600 × 600 workflow</text><text x="867" y="205" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Adapter translates device input</text><path d="M360 170H432" fill="none" stroke="#53636b" stroke-width="2" marker-end="url(#arrow)" /><path d="M840 170H768" fill="none" stroke="#53636b" stroke-width="2" marker-end="url(#arrow)" /><rect x="35" y="304" width="320" height="132" rx="9" fill="#e9e8e2" stroke="#cad1ce"/><rect x="35" y="322" width="4" height="96" fill="#536927"/><text x="57" y="338" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#172329" font-weight="700">Local draft storage</text><text x="57" y="369" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >IndexedDB + sync queue</text><text x="57" y="393" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Device-only ≠ server-saved</text><text x="57" y="417" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Revision conflicts stay visible</text><rect x="440" y="304" width="320" height="132" rx="9" fill="#e9e8e2" stroke="#cad1ce"/><rect x="440" y="322" width="4" height="96" fill="#536927"/><text x="462" y="338" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#172329" font-weight="700">Express API</text><text x="462" y="369" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Authentication + owner scope</text><text x="462" y="393" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >SQLite records + audit chain</text><text x="462" y="417" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Private photo storage</text><rect x="845" y="304" width="320" height="132" rx="9" fill="#e9e8e2" stroke="#cad1ce"/><rect x="845" y="322" width="4" height="96" fill="#536927"/><text x="867" y="338" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#172329" font-weight="700">Evidence providers</text><text x="867" y="369" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Browser / phone fallback</text><text x="867" y="393" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Native capture: companion needed</text><text x="867" y="417" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53636b" >Mock AI does not inspect pixels</text><path d="M510 231V265H195V296" fill="none" stroke="#53636b" stroke-width="2" marker-end="url(#arrow)" /><path d="M640 231V296" fill="none" stroke="#53636b" stroke-width="2" marker-end="url(#arrow)" /><path d="M360 369H432" fill="none" stroke="#53636b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M840 369H768" fill="none" stroke="#53636b" stroke-width="2" marker-end="url(#arrow)" /><rect x="35" y="487" width="1130" height="71" rx="8" fill="#e9e8e2" stroke="#cad1ce"/><text x="58" y="519" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#536927" font-weight="700">REVIEW BOUNDARY</text><text x="58" y="545" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#172329" >A suggestion, photo, attendance entry, or synced draft is not automatically a confirmed safety record.</text></svg>
